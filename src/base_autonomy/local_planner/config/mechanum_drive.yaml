# Sensor mounting offsets (used for TF transforms)
sensorMountingOffsets:
  sensorOffsetX: 0.0
  sensorOffsetY: 0.0
  sensorOffsetZ: 0.0

localPlanner:
  ros__parameters:
    # Vehicle dimensions
    vehicleLength: 0.5
    vehicleWidth: 0.5

    # Speed limits
    maxSpeed: 0.875
    autonomySpeed: 0.875

    # Goal tolerances
    goalClearRange: 0.35
    goalBehindRange: 0.35

pathFollower:
  ros__parameters:
    # Control parameters
    lookAheadDis: 0.5
    maxAccel: 2.0

    # Slow down threshold
    slowDwnDisThre: 0.875
    omniDirDiffThre: 1.5